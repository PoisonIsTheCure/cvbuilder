server:
  port: 8080

spring:
  application:
    name: cvgenerator

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/cvgenerator
    username: your_db_user
    password: your_db_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null

# ── JWT ────────────────────────────────────────────────────────────────────────
# Generate secret with: openssl rand -base64 64
jwt:
  secret: your_new_very_long_secret_key_that_is_at_least_32_chars
  expiration-ms: 86400000 # 24 hours

# ── SpringDoc / Swagger ────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs